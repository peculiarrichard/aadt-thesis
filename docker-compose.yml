services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-addt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-addt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-addt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - addt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-addt}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  addt_pg_data:
